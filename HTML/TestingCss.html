<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="StyleCss/Testingcss.css">
    <style>
        /* Block example */
        .block {
            display: block;
            background: lightblue;
            padding: 10px;
            margin: 5px 0;
        }

        /* Inline example */
        .inline {
            display: inline;
            background: lightgreen;
            padding: 5px;
        }

        /* Inline-block example */
        .inline-block {
            display: inline-block;
            background: lightcoral;
            width: 120px;
            height: 60px;
            margin: 5px;
            text-align: center;
            line-height: 60px;
        }
    </style>
</head>

<body>

    <h2>Block Example</h2>
    <div class="block">Block 1</div>
    <div class="block">Block 2</div>
    <div class="block">Block 3</div>

    <h2>Inline Example</h2>
