<!DOCTYPE html>
<html>

<head>
  <title>Dashboard with Grid Areas</title>
  <style>
    /* Topbar
    .topbar {
      background: #333;
      color: white;
      padding: 10px;
      text-align: center;
    } */

    .topbar{
      display:flex;
      justify-content:center;
      align-items:center;
      background-color:#333;
      color:white;
      height:50px;
    }

    .container{
      display:grid;
      grid-template-areas:
        "sidebar card1 card2 card3 card4"
        "sidebar activity activity activity activity"
        "sidebar details details details details";
    }

    .sidebar{
      grid-area:sidebar;
      background-color:#f4f4f4;
      padding:10px;
    }

    .card1{
      grid-area:card1;
      background-color:#fff;
      padding:10px;
      border:1px solid #ccc;
    }
    .card2{
      grid-area:card2;
      background-color:#fff;
      padding:10px;
      border:1px solid #ccc;
    }
    .card3{
      grid-area:card3;
      background-color:#fff;
      padding:10px;
      border:1px solid #ccc;
    }

    .card4{
      grid-area:card4;
      background-color:#fff;
      padding:10px;
      border:1px solid #ccc;
    }

    .activity{
      grid-area:activity;
      background-color:#fff;
      padding:10px;
      border:1px solid #ccc;
    }

    .details{
      grid-area:details;
      background-color:#fff;
      padding:10px;
      border:1px solid #ccc;
    }
  </style>
</head>

<body>
  <div class="topbar">TOP NAVBAR</div>

  <div class="container">
    <div class="sidebar">SIDEBAR NAVIGATION</div>

    <div class="card1">STAT CARD 1</div>
    <div class="card2">STAT CARD 2</div>
    <div class="card3">STAT CARD 3</div>
    <div class="card4">STAT CARD 4</div>

    <div class="activity">RECENT ACTIVITY SECTION</div>
    <div class="details">USER DETAILS / OTHER INFO SECTION</div>
  </div>
</body>

</html>
