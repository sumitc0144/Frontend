<!DOCTYPE html>
<html>
<head>
  <title>Dashboard with Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* Navbar */
.navbar {
  background: #333;
  color: white;
  padding: 15px;
  text-align: center;
}

/* Grid container */
.container {
  display: grid;
  grid-template-columns: 200px 1fr 1fr 1fr 1fr; /* sidebar + 4 columns */
  grid-template-rows: auto auto auto;          /* stat cards, activity, details */
  gap: 10px;
  padding: 10px;
}

/* Sidebar spans all rows */
.sidebar {
  grid-row: 1 / span 3;
  background: #444;
  color: white;
  padding: 20px;
}

/* Stat cards row */
.card {
  background: #eee;
  padding: 20px;
  text-align: center;
}

/* Recent activity spans across 4 columns */
.activity {
  grid-column: 2 / span 4;
  background: #f9f9f9;
  padding: 20px;
}

/* User details spans across 4 columns */
.details {
  grid-column: 2 / span 4;
  background: #ddd;
  padding: 20px;
}
</style>
<body>
  <!-- Top Navbar -->
  <div class="navbar">TOP NAVBAR</div>

  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">SIDEBAR NAVIGATION</div>

    <!-- Stat Cards -->
    <div class="card card1">STAT CARD 1</div>
    <div class="card card2">STAT CARD 2</div>
    <div class="card card3">STAT CARD 3</div>
    <div class="card card4">STAT CARD 4</div>

    <!-- Recent Activity -->
    <div class="activity">RECENT ACTIVITY SECTION</div>

    <!-- User Details -->
    <div class="details">USER DETAILS / OTHER INFO SECTION</div>
  </div>
</body>
</html>
