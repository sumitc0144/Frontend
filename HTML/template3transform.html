<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        body {
            perspective: 1000px;
            /* enables 3D depth */
        }

        .container {
            height: 50px;
            width: 50px;
            border: 2px solid black;
            background: #e9e6e6;
            /* starts slow, speeds up in the middle, slows down at the end. */
            transition: transform 0.5s ease-in-out;
            /* starts slow, speeds up, then slows down again.Good for hover effect */
            transition: transform 0.5s ease;
            /* starts slow, then speeds up quickly */
            transition: transform 0.5s ease-in;
            /* smoother animation */
        }

        /* Translate */
        .translate {
            height: 50px;
            width: 50px;
            border: 2px solid black;
            background: #e9e6e6;
            text-align-last: center;
            
        }
        .translate:hover {
            transform: translateX(300px) translateY(200px) translateZ(500px);
            transition: transform 5s ease;
        }

        /* Rotate */
        .container1 {
            height: 50px;
            width: 50px;
            border: 2px solid black;
            background: #e9e6e6;
            
        }

        .container1:hover {
            transform: rotateX(45deg) rotateY(45deg) rotateZ(45deg);
            transition: transform 0.5s ease-in-out;
            /* smoother animation */
        }

        /* Scale */
        .container {
            height: 50px;
            width: 50px;
            border: 2px solid black;
            background: #e9e6e6;
        
        }

        .container:hover {
            transform: scale(1.5);
            transition: transform 0.5s ease-in-out;
            /* smoother animation */
        }

        /* Skew */
        .skew1 {
            height: 50px;
            width: 50px;
            border: 2px solid black;
            background: #e9e6e6;
            
        }

        .skew1:hover {
            transform: skewY(30deg) skewY(30deg);
            transition: transform 0.5s ease-in-out;
            /* smoother animation */

        }
    </style>
</head>

<body>
    <h1 style="text-align: center;">TRANSFORM</h1>
    <div class="container">scale</div>
    <div class="container1">Rotate</div>
    <div class="translate">Translate</div>
    <div class="skew1" style="border: 2px solid; background-color: aquamarine; height: 50px; width:50px;">
        skew1
    </div>
</body>

</html>
