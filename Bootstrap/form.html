<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form Template</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body>
    <div class="container text-center">
    <h2>Registration Form</h2>
    <form action=" " method="post" class="border border-4 border-danger rounded" >
        <!-- Name -->
        <label for="name" class="form-label">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <!-- Email -->
        <label for="email" class="form-label">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <!-- Phone -->
        <label for="phone" class="form-label">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone"><br><br>

        <!-- Gender -->
        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male" class="form-label">Male</label><br>
        <input type="radio" id="female" name="gender" value="Female">
            <label for="female" class="form-label">Female</label><br><br>

            <!-- Course -->
            <label for="course" class="form-label">Course:</label><br>
            <select id="course" name="course" class="form-label">
                <option value="computer-science">Computer Science</option>
                <option value="commerce">Commerce</option>
                <option value="arts">Arts</option>
            </select><br><br>

            <!-- Date of Birth -->
            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob"><br><br>

            <!-- Submit -->
            <button type="button" class="btn btn-primary">Primary</button>
            <button type="button" class="btn btn-secondary">Secondary</button>
            <button type="button" class="btn btn-success">Success</button>
            <button type="button" class="btn btn-danger">Danger</button>
            <button type="button" class="btn btn-warning">Warning</button>
            <button type="button" class="btn btn-info">Info</button>
            <button type="button" class="btn btn-light">Light</button>
            <button type="button" class="btn btn-dark">Dark</button>

            
    </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
