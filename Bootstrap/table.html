<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Simple Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <div class="table-responsive">
                        <!-- enable table ,margin-top,border,color,alternate-shade-->
    <table border="1" class="table mt-5 table-bordered table-warning table-striped">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Role</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Sumit</td>
            <td>Developer</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Pooja</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Soma</td>
            <td>Tester</td>
        </tr>
    </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
