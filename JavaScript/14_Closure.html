<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closure</title>
</head>

<body>
    <script>
        // An inner function “remembers” and can access variables from its outer function’s scope, 
        // even after the outer function has finished executing

        //Basic Closure
        function outer() {
            let name = "Sumit"; // variable in outer scope
            function inner() {
                console.log("Hello " + name);
            }
            return inner;
        }

        const greet = outer();
        greet(); // "Hello Sumit"

    </script>
</body>

</html>
