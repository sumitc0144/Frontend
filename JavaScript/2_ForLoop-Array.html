<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array(loop)</title>
</head>

<body>
    <script>
        // Different ways to create arrays
        let arr1 = [10, 20, 30];        // Literal notation
        let arr2 = new Array(); // Using constructor
        arr2[0] = "Apple";
        arr2[1] = "Banana";
        arr2[2] = "Mango";
        console.log(arr1);
        console.log(arr2);

        let fruits = ["Apple", "Banana", "Mango", "Orange", "Grapes"];
        // Iterates over the values of an iterable 
        for (let fruit of fruits) {
            if (fruit === "Banana") {
                console.log(fruit + " is yellow!");
            } else if (fruit === "Apple") {
                console.log(fruit + " is red!");
            } else {
                console.log(fruit + " is tasty!");
            }
        }

        // Iterates over the keys
        for (let index in fruits) {
            console.log("Index:", index, "Value:", fruits[index]);
        }
        
        console.log("Using ForEach");
                        //value,index
        fruits.forEach((fruit, index) => {
            console.log("Index:", index, "Fruit:", fruit);
        });

    </script>
</body>

</html>
