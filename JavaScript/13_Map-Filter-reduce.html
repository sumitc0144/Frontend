<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map-Filter-reduce</title>
</head>

<body>
    <script>
        //MAP
        // Creates a new array with the results of calling a provided function on every element in the calling array.
        const numbers = [1, 2, 3, 4];
        const doubled = numbers.map(num => num * 2);
        console.log(doubled); // [2, 4, 6, 8]
        //FILTER
        // Only elements that satisfy the condition remain, array length may shrink.
        const num = [1, 2, 3, 4];
        const evens = num.filter(num => num % 2 === 0);
        console.log(evens); // [2, 4]
        //Map + Filter
        const users = [
            { name: "Sumit", age: 22 },
            { name: "Ravi", age: 17 },
            { name: "Priya", age: 25 }
        ];

        // Get names of users age ≥ 18
        const adultNames = users
            .filter(user => user.age >= 18)
            .map(user => user.name);

        console.log(adultNames); // ["Sumit", "Priya"]

        //REDUCE
        // Reduces the array to a single value by applying a function to each element and accumulating the result.
        const nums = [1, 2, 3, 4];
        const sum = nums.reduce((acc, num) => acc + num, 0);
        console.log(sum); // 10
    </script>
</body>

</html>
