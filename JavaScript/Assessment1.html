<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment of Javascript 1</title>
</head>

<body>
    <script>
        // Largest of three numbers
        let a = 25, b = 42, c = 18;

        // Using conditional statements
        if (a >= b && a >= c) {
            console.log("Largest number is:", a);
        } else if (b >= a && b >= c) {
            console.log("Largest number is:", b);
        } else {
            console.log("Largest number is:", c);
        }

        // Grade calculator
        let marks = 85; // Example marks

        if (marks >= 90 && marks <= 100) {
            console.log("Grade: A");
        } else if (marks >= 80) {
            console.log("Grade: B");
        } else if (marks >= 70) {
            console.log("Grade: C");
        } else if (marks >= 60) {
            console.log("Grade: D");
        } else {
            console.log("Grade: F");
        }


    </script>
</body>

</html>
