<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom 3</title>
</head>
<body>
    <ul id="fruit">
        <li id="apple">Apple</li>
        <li>Banana</li>
        <li>papaya</li>
        <li>grapes</li>
        <li>mango</li>
    </ul>
</body>
<script>
    let strw = document.createElement("li");
    strw.textContent="Strawberry";
    console.log(strw);

    let fruits = document.getElementById("fruit");
    console.log(fruits);
    fruits.appendChild(strw);


    let apple = document.getElementById("apple");
    fruits.removeChild(apple);
</script>
</html>
